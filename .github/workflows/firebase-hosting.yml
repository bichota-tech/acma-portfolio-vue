name: Deploy to Firebase Hosting

# Se ejecuta en cada push a la rama main
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 3. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 4. Instalar dependencias
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Ejecutar tests unitarios
      - name: Run unit tests
        run: pnpm test:unit --run

      # 6. Ejecutar linting
      - name: Run linting
        run: pnpm lint --max-warnings=0

      # 7. Construir aplicación Vue
      - name: Build Vue app
        run: pnpm build

      # 8. Validar Firebase service account
      - name: Check service account secret is present
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is empty"
            exit 1
          fi
          echo "Firebase service account is configured"

      # 9. Deploy a Firebase Hosting
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
